<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVS Healthcare | Healthcare Staffing Solutions</title>
    <meta name="description" content="EVS Healthcare Solutions - Quality healthcare staffing across North-West England. NHS-approved professionals, 24/7 support." />

    <!-- ─── Cloudinary Upload Widget ─────────────────────────────────────── -->
    <!-- Preload the script for faster loading -->
    <link rel="preload" href="https://upload-widget.cloudinary.com/global/all.js" as="script" />
    <!-- Load the script without SRI (to avoid hash mismatch errors) -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" crossorigin="anonymous" defer></script>

    <!-- ─── Google Analytics Consent Mode ────────────────────────────────── -->
    <!-- Default to denied until consent is given via cookie banner -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
    </script>

    <!-- ─── Google Analytics 4 ───────────────────────────────────────────── -->
    <!-- ⚠️ REPLACE G-XXXXXXXXXX WITH YOUR ACTUAL GA4 MEASUREMENT ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
