[build]
  command = "npm run build"
  publish = "dist"

[dev]
  # This is the port where Netlify Dev will run its proxy server
  port = 8888
  # This is the port where your Vite dev server runs
  targetPort = 5174

[[redirects]]
  from = "https://evshealthcare.co.uk/*"
  to = "https://www.evshealthcare.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://evshealthcare.co.uk/*"
  to = "https://www.evshealthcare.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200