[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"
  GENERATE_SOURCEMAP = "false"

# ── Allow sitemap.xml and robots.txt to be served directly ──
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# ── SPA Catch-All Redirect ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200